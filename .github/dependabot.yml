version: 2
updates:
  # Compose files need the dedicated ecosystem (including digest-only images).
  # Apps koji-genba/* use reviewed digests or staging's edge workflow.
  # Keep their entries for future upstream images; ignore only our repositories.
  # Apps upstream images are pinned digest-only, which Dependabot resolves
  # to `latest`; they are ignored until their Compose lines are migrated to
  # tag+digest, then remove these ignores.
  - package-ecosystem: docker-compose
    directory: /files/services/compose/edge
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "koji-genba/*"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/dns
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "adguard/adguardhome"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/samba
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "koji-genba/*"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/stashpad-prod
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "koji-genba/*"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/stashpad-staging
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "koji-genba/*"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/sillytavern
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "sillytavern/sillytavern"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/open-webui
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "open-webui/open-webui"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/searxng
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "searxng/searxng"
      - dependency-name: "isokoliuk/mcp-searxng"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/sparkdash
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "koji-genba/*"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/homepage
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "gethomepage/homepage"
  - package-ecosystem: docker-compose
    directory: /files/services/compose/monitoring
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "twinproduction/gatus"
  - package-ecosystem: docker-compose
    directory: /files/services/agent/stack
    schedule: {interval: weekly}
    ignore:
      # Own workflows publish these; manually re-pin the tested digests.
      - dependency-name: "koji-genba/homelab-*"
  - package-ecosystem: docker
    directory: /files/services/images/caddy-cloudflare
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /files/services/images/sparkdash
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /files/services/images/hermes-agent
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /files/services/images/tei-reranker-onnx
    schedule: {interval: weekly}
    ignore:
      # Export wheels are cp312 and hash-pinned; keep Python 3.12-slim.
      # Digest refreshes and TEI base image updates remain enabled.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /files/services/images/memory-db
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /files/tools/homelab-toolbox
    schedule: {interval: weekly}
  # Batch Python updates monthly to reduce toolbox publishes and digest bumps.
  - package-ecosystem: pip
    directory: /files/tools/homelab-toolbox
    schedule: {interval: monthly}
    groups:
      toolbox-python:
        patterns: ["*"]
  # Review provider bumps together across all six Proxmox roots:
  # apps-vm, agent-vm, runner-vm, elastiflow, tailscale-gateway and stashpad-dev.
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/apps-vm
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/agent-vm
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/runner-vm
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/elastiflow
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/tailscale-gateway
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/stashpad-dev
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /files/infrastructure/terraform/tailscale
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}

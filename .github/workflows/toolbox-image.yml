name: Build management toolbox image

on:
  push:
    branches: [main]
    paths:
      - files/tools/homelab-toolbox/**
      - .github/workflows/toolbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish toolbox image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --push \
            --tag ghcr.io/koji-genba/homelab-toolbox:1.0.1 \
            --file files/tools/homelab-toolbox/Dockerfile \
            files/tools/homelab-toolbox
          digest="$(docker buildx imagetools inspect ghcr.io/koji-genba/homelab-toolbox:1.0.1 | awk '/^Digest:/ {print $2; exit}')"
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
          {
            echo '## Toolbox image'
            echo
            echo "\`ghcr.io/koji-genba/homelab-toolbox@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

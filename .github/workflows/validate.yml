name: Validate infrastructure and applications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    env:
      TOOLBOX_BUILD_IMAGE: homelab-toolbox:ci
      TOOLBOX_IMAGE: homelab-toolbox:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned management toolbox
        run: make toolbox-build
      - name: Terraform formatting
        run: make terraform-fmt
      - name: Terraform Apps VM validation
        run: make terraform-validate
      - name: Terraform ElastiFlow validation
        run: make terraform-validate-elastiflow
      - name: Terraform Tailscale Gateway validation
        run: make terraform-validate-tailscale-gateway
      - name: Terraform stashPadDev validation
        run: make terraform-validate-stashpad-dev
      - name: Terraform Tailscale validation
        run: make terraform-validate-tailscale
      - name: Terraform Agent VM validation
        run: make terraform-validate-agent-vm
      - name: Terraform Runner VM validation
        run: make terraform-validate-runner-vm
      - name: Ansible lint and syntax check
        run: |
          make ansible-lint
          make ansible-check
      - name: Hermes Agent Ansible lint and syntax check
        run: |
          make ansible-lint-agent
          make ansible-check-agent
      - name: Gateway Ansible lint and syntax check
        run: |
          make ansible-lint-gateway
          make ansible-check-gateway
      - name: ElastiFlow Ansible lint and syntax check
        run: |
          make ansible-lint-elastiflow
          make ansible-check-elastiflow
      - name: Ansible bootstrap path regression
        run: make ansible-bootstrap-paths-test
      - name: Gateway advertisement and Terraform approval contract
        run: make gateway-routes-test
      - name: Compose reconcile bind-mount regression
        run: make compose-reconcile-fixture
      - name: Toolbox arbitrary UID/GID regression
        run: make toolbox-uid-test
      - name: Apps VM cloud-init schema regression
        run: make cloud-init-test
      - name: Agent VM cloud-init schema regression
        run: make agent-vm-cloud-init-test
      - name: Runner VM cloud-init schema regression
        run: make runner-vm-cloud-init-test
      - name: Apps VM cloud-init lifecycle regression
        run: make terraform-apps-vm-lifecycle-test
      - name: Agent/Runner VM cloud-init lifecycle regression
        run: make terraform-agent-runner-vm-lifecycle-test
      - name: Runner privilege regression
        run: make runner-privilege-fixture
      - name: Runner egress firewall regression
        run: make runner-firewall-fixture
      - name: Agent/Runner Terraform scope regression
        run: make agent-runner-scope-fixture
      - name: Agent Docker DNAT guard regression
        run: make agent-dnat-guard-fixture
      - name: Agent backup regression
        run: make agent-backup-fixture
      - name: Agent health check regression
        run: make agent-healthcheck-fixture
      - name: Agent restore/export/rebuild regression
        run: make agent-restore-fixture
      - name: Compose configuration
        run: make compose-config
      - name: Agent Compose configuration
        run: make agent-compose-config
      - name: AdGuard schema-34 configuration check
        run: make adguard-config-check
      - name: Gatus Caddy probe regression check
        run: make gatus-config-check
      - name: Storage mover regression check
        run: make mover-test
      - name: HF downloader input and storage regression
        run: make hf-downloader-test
      - name: Shell lint
        run: make shellcheck
      - name: Plaintext secret and state scan
        run: make secrets-scan
      - name: State backup worktree fixture
        run: make state-backup-test
      - name: State restore fixture
        run: make state-restore-test
      - name: State backup preflight fixture
        run: make state-backup-preflight-test
      - name: Tailscale ACL path fixture
        run: make tailscale-acl-path-test
      - name: Tailscale import gates fixture
        run: make tailscale-import-gates-test

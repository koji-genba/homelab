apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stashpad-prod

resources:
  - ../../base
  - namespace.yaml
  - pv-media.yaml
  - pvc-media.yaml
  - ingress.yaml

# ghcr-pull-secret は値を含むため git 管理しない。
# 事前に1回だけ手動で作成しておくこと(README.md参照)。

images:
  - name: ghcr.io/koji-genba/stashpad
    # staging と違いここは自動更新しない。昇格したいバージョンに
    # 手動で書き換えて commit & push すること(= prodへの反映操作そのもの)。
    newTag: edge

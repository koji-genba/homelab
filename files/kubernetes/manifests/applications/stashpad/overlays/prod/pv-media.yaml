# staging と同じ実データ(NFS 192.168.10.11:/mnt/shared/koji-genba)を
# 読み取り専用で参照する静的PV。PV<->PVCは1:1バインドのためstaging用と別に定義。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stashpad-media-pv-prod
  labels:
    app.kubernetes.io/name: stashpad
    app.kubernetes.io/component: storage
    app.kubernetes.io/environment: prod
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media-static
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
    - ro
  nfs:
    server: 192.168.10.11
    path: /mnt/shared/koji-genba

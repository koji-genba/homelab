apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stashpad-staging

resources:
  - ../../base
  - namespace.yaml
  - pv-media.yaml
  - pvc-media.yaml
  - ingress.yaml

# ghcr-pull-secret は値を含むため git 管理しない。
# 事前に1回だけ手動で作成しておくこと(README.md参照)。

images:
  - name: ghcr.io/koji-genba/stashpad
    # Flux Image Update Automation がこの行を自動で書き換える(main pushのたびに追従)
    newTag: edge # {"$imagepolicy": "flux-system:stashpad-staging:tag"}

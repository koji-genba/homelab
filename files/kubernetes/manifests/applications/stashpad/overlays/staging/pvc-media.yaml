apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stashpad-media
  namespace: stashpad-staging
  labels:
    app.kubernetes.io/name: stashpad
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: nfs-media-static
  volumeName: stashpad-media-pv-staging
  resources:
    requests:
      storage: 1Ti

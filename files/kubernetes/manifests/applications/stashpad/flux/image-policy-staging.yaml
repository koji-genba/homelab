apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: stashpad-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: stashpad
  # main-<run_number>-<short_sha> の run_number 部分だけを取り出し、
  # 数値の大きい(=新しい)ものを最新とみなす。main以外のブランチのタグ("edge"など)は対象外。
  filterTags:
    pattern: '^main-(?P<num>[0-9]+)-[0-9a-f]+$'
    extract: "$num"
  policy:
    numerical:
      order: asc

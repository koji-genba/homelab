apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stashpad-staging
  namespace: flux-system
spec:
  interval: 5m
  timeout: 2m
  path: ./files/kubernetes/manifests/applications/stashpad/overlays/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sillytavern
  labels:
    app.kubernetes.io/name: sillytavern
    app.kubernetes.io/component: llm-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sillytavern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sillytavern
        app.kubernetes.io/component: llm-frontend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: sillytavern
          # tag は overlay の kustomization.yaml (images:) で差し替える
          image: ghcr.io/sillytavern/sillytavern:1.18.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SILLYTAVERN_LISTEN
              value: "true"
            - name: SILLYTAVERN_WHITELISTMODE
              value: "false"
            - name: SILLYTAVERN_BASICAUTHMODE
              value: "true"
            - name: SILLYTAVERN_BASICAUTHUSER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sillytavern-basic-auth
                  key: username
            - name: SILLYTAVERN_BASICAUTHUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sillytavern-basic-auth
                  key: password
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /home/node/app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sillytavern-data

# Agent VM (agent-vm, VMID 104) resident services.
#
# This project is deliberately OUTSIDE files/services/compose/ so the Apps VM
# reconciler, its hardcoded project allowlist, the digest gate and
# scripts/compose-config.sh never pick it up. It is rendered and started by the
# Ansible role agent_stack (files/infrastructure/ansible/agent/roles/agent_stack)
# after manual approval; it is not wired to the 15-minute Apps reconcile timer.
#
# Everything runs on one bridge; only Hermes Webapp is published on the Agent
# LAN IP, with an Apps-only nftables guard. The memory services stay private.
# Hermes reaches outward (Discord, the GLM endpoint on 192.168.10.51, and the
# Apps VM FQDNs mapped below). The memory stack is reachable only from this project.
#
# Restart policy: every long-running service uses `restart: unless-stopped`.
# This differs from the Apps VM, which leaves `restart` unset and relies on its
# systemd-ordered reconcile loop. The Agent stack has no reconciler and no unit
# ordering: its state is on the local data disk (not NFS) and its bind mounts use
# create_host_path:false, so a missing mount is a loud start failure rather than a
# silently empty directory. `unless-stopped` revives a crashed service after a
# reboot while leaving an operator-stopped service stopped.
#
# Resource limits: the Agent VM is a 24 GiB guest without swap, running six
# services, two of them CPU inference servers. Every service has a `mem_limit`
# and the two TEI servers a `cpus` cap. The limits are sized for the pinned
# models: 16.625 GiB total leaves 7.375 GiB for OS/Docker and page cache.
# CPU caps total 10 on the 12-vCPU VM, leaving 2 for the other services and OS;
# caps are ceilings, not reservations. Model prefetch is download-only,
# capped at 1 GiB, and finishes before the inference servers start.
#
# Image digests follow the repo convention. All three self-built images
# (Hermes, memory-db, tei-reranker-onnx) are published and pinned as of
# 2026-10-18 by their image workflows
# (.github/workflows/hermes-agent-image.yml, memory-db-image.yml,
# tei-reranker-onnx-image.yml).
# The role's helper (installed as /usr/local/sbin/homelab-agent-compose-up from
# roles/agent_stack/templates/homelab-agent-compose-up.sh.j2) still refuses to
# start on an ALL-ZERO placeholder or any unpinned image as a safety net.
name: agent

services:
  memory-db:
    # Built by .github/workflows/memory-db-image.yml (PostgreSQL 17 + pgvector +
    # PGroonga). Pinned to the digest published by the first workflow run
    # (tag pg17, 2026-10-18).
    image: ghcr.io/koji-genba/homelab-memory-db@sha256:1d9dbb48bd8cfef3cfea74b94079c3c82e243c7f071ed9231c20cd69330df7b6
    restart: unless-stopped
    # PostgreSQL with a small shared buffer: 2 GiB covers connections, index
    # builds and pgroonga maintenance without letting a runaway query take the VM.
    mem_limit: 2g
    env_file:
      # POSTGRES_PASSWORD, generated on the Agent VM by the Ansible role (not a
      # SOPS value: it is reproducible and nothing external depends on it). The
      # role's compose wrapper also passes this file with --env-file so the same
      # value interpolates into Hindsight's DATABASE_URL below; there is exactly
      # one file, not a second copy.
      - path: "${SECRETS_DIR:?set SECRETS_DIR}/memory-db.env"
        format: raw
    environment:
      # The image extends the upstream PGroonga PostgreSQL 17 image with
      # pgvector. It runs no init SQL: Hindsight creates the vector, pg_trgm and
      # pgroonga extensions itself on first boot (POSTGRES_USER is a superuser)
      # and then owns the schema.
      POSTGRES_USER: hindsight_user
      POSTGRES_DB: hindsight_db
    volumes:
      # Data lives on the Agent VM's dedicated data disk, never on NFS.
      - type: bind
        source: "${POSTGRES_DATA_DIR:?set POSTGRES_DATA_DIR}"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - internal
    # The Debian PostgreSQL entrypoint starts as root, chowns the data directory
    # and then drops to the postgres account (su-exec), so it needs exactly these
    # capabilities instead of Docker's default set.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # PostgreSQL uses shared memory for parallel workers and index builds.
    shm_size: 512m
    healthcheck:
      test: [CMD, pg_isready, -U, hindsight_user, -d, hindsight_db]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  embedding:
    # HuggingFace Text Embeddings Inference (CPU), ghcr.io/huggingface/
    # text-embeddings-inference pinned to the cpu-1.9.4 index digest.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    # WS16 cpu-1.9.4: swap-free 4096-token warm-up/workload peak ~5.38 GiB.
    # Keep 8g (~2.62 GiB headroom); WS13 also confirmed startup OOM at 4g.
    # Throughput scales almost linearly from 1 to 2 to 4 CPUs. Background retain
    # can overlap rerank: embedding 4 + reranker 6 leaves 2 of the VM's 12 vCPUs.
    mem_limit: 8g
    cpus: "${TEI_EMBEDDING_CPUS:?set TEI_EMBEDDING_CPUS}"
    # Non-privileged port so the container can drop every capability.
    command:
      - --model-id
      - "${TEI_EMBEDDING_MODEL:?set TEI_EMBEDDING_MODEL}"
      - --revision
      - "${TEI_EMBEDDING_REVISION:?set TEI_EMBEDDING_REVISION}"
      # Two Hindsight requests x 32 inputs, plus 64 permits of headroom.
      # TEI 1.9 acquires a permit immediately for every input, not per HTTP call.
      - --max-concurrent-requests
      - "128"
      # WS13b: retain embeds extracted facts augmented with dates/entities,
      # not chunk bodies (only retain_extraction_mode=chunks with LLM provider
      # none embeds those). Keep 4096 as headroom for long facts/observations
      # plus the ruri passage prefix. TEI auto-truncate lowers max_input_length
      # to max_batch_tokens; Hindsight's separate o200k cap is not a ruri bound.
      # Very long/arbitrary Unicode inputs can still be truncated by TEI.
      - --max-batch-tokens
      - "${HINDSIGHT_EMBEDDINGS_MAX_INPUT_TOKENS:?set HINDSIGHT_EMBEDDINGS_MAX_INPUT_TOKENS}"
      - --auto-truncate
    environment:
      PORT: "8080"
      # Never reach the network: the role pre-fetched the pinned revision into
      # MODELS_DIR with a one-shot container that had a working resolver for the
      # xet CDN. See docs in the role defaults.
      HF_HUB_OFFLINE: "1"
      RAYON_NUM_THREADS: "${TEI_EMBEDDING_THREADS:?set TEI_EMBEDDING_THREADS}"
      OMP_NUM_THREADS: "${TEI_EMBEDDING_THREADS:?set TEI_EMBEDDING_THREADS}"
      MKL_NUM_THREADS: "${TEI_EMBEDDING_THREADS:?set TEI_EMBEDDING_THREADS}"
    volumes:
      - type: bind
        source: "${MODELS_DIR:?set MODELS_DIR}"
        target: /data
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  reranker:
    # Built by .github/workflows/tei-reranker-onnx-image.yml (pinned FP32 ONNX
    # with Candle-compatible tanh GELU on TEI cpu-1.9.4 ORT). Pinned to the
    # digest published by the first workflow run (tag cpu-1.9.4, 2026-10-18).
    image: ghcr.io/koji-genba/homelab-tei-reranker-onnx@sha256:ccc54b553f32e619e278544d70961c0dc8ddfac67beffdf6bf40c3e625240a79
    restart: unless-stopped
    # ORT uses num_cpus 1.17 (cgroup v1/v2 quota aware) for intra-op threads:
    # 6 CPU quota -> 6 threads; OMP/MKL/Rayon envs alone do not set ORT threads.
    # WS15: FP32/tanh peak ~2.77 GiB at 4g, ~3.3x faster than Candle locally.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "${TEI_RERANKER_CPUS:?set TEI_RERANKER_CPUS}"
    command:
      - --model-id
      - /model
      # Hindsight globally serializes batches of up to 32 pairs; allow headroom.
      - --max-concurrent-requests
      - "64"
      # The token limit also caps each query/document pair under auto-truncate.
      # Keep it at 2048; shrinking it for throughput can discard evidence.
      # ORT runtime batch ceiling is 8. Leave --max-batch-requests unset.
      - --max-batch-tokens
      - "2048"
      - --tokenization-workers
      - "${TEI_RERANKER_TOKENIZATION_WORKERS:?set TEI_RERANKER_TOKENIZATION_WORKERS}"
      - --auto-truncate
    environment:
      PORT: "8080"
      HF_HUB_OFFLINE: "1"
      RAYON_NUM_THREADS: "${TEI_RERANKER_THREADS:?set TEI_RERANKER_THREADS}"
      OMP_NUM_THREADS: "${TEI_RERANKER_THREADS:?set TEI_RERANKER_THREADS}"
      MKL_NUM_THREADS: "${TEI_RERANKER_THREADS:?set TEI_RERANKER_THREADS}"
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  hindsight:
    # ghcr.io/vectorize-io/hindsight slim (v1.1.0): external embeddings and
    # reranking, no baked-in models. Pinned by tag and index digest below.
    image: ghcr.io/vectorize-io/hindsight:1.1.0-slim@sha256:fbc37d194bce007b6cce2fd9f66cd7f8c050bd18b80e662090a92835d9cb191d
    restart: unless-stopped
    # API server only: PostgreSQL and the models are external, so 1 GiB is ample.
    mem_limit: 1g
    depends_on:
      memory-db:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    environment:
      # --- Database: external PostgreSQL, vector + multilingual full text. ---
      HINDSIGHT_API_DATABASE_URL: "postgresql://hindsight_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@memory-db:5432/hindsight_db"
      HINDSIGHT_API_VECTOR_EXTENSION: pgvector
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: pgroonga
      # Multilingual bank: keep the query analyzer broad for Japanese/English.
      HINDSIGHT_API_QUERY_ANALYZER_LANGUAGES: "en,ja"
      # --- Embeddings / reranking: the TEI sidecars above. ---
      # One API process with its embedded async worker: the provider shares two
      # HTTP slots across query/retain callers on the serving loop (32 texts each).
      # Recalculate TEI permits if workers, replicas, batch or concurrency change.
      HINDSIGHT_API_WORKERS: "1"
      HINDSIGHT_API_EMBEDDINGS_TEI_BATCH_SIZE: "32"
      # Bound CPU queueing: eight retain requests exceeded the client timeout
      # in WS16. Two still keep Candle's four-input batches supplied.
      HINDSIGHT_API_EMBEDDINGS_MAX_CONCURRENT_REQUESTS: "2"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: tei
      HINDSIGHT_API_EMBEDDINGS_TEI_URL: "http://embedding:8080"
      # ruri-v3 is asymmetric: Hindsight prepends these literally on the recall
      # query side and the retained-document side (the TEI provider is plain
      # text-in/vector-out, so the client carries the task prefix). The trailing
      # space is part of the model card's prefix.
      HINDSIGHT_API_EMBEDDINGS_QUERY_PREFIX: "${HINDSIGHT_EMBEDDINGS_QUERY_PREFIX:?set HINDSIGHT_EMBEDDINGS_QUERY_PREFIX}"
      HINDSIGHT_API_EMBEDDINGS_PASSAGE_PREFIX: "${HINDSIGHT_EMBEDDINGS_PASSAGE_PREFIX:?set HINDSIGHT_EMBEDDINGS_PASSAGE_PREFIX}"
      # Hindsight's o200k input guard; TEI uses the same numeric ceiling with
      # ruri's tokenizer. See the length/truncation caveat above.
      HINDSIGHT_API_EMBEDDINGS_MAX_INPUT_TOKENS: "${HINDSIGHT_EMBEDDINGS_MAX_INPUT_TOKENS:?set HINDSIGHT_EMBEDDINGS_MAX_INPUT_TOKENS}"
      HINDSIGHT_API_RERANKER_PROVIDER: tei
      HINDSIGHT_API_RERANKER_TEI_URL: "http://reranker:8080"
      # Match TEI's max_client_batch_size=32; Hindsight's default 128 gets
      # HTTP 413 above 32. Serialize CPU batches across recall operations.
      HINDSIGHT_API_RERANKER_TEI_BATCH_SIZE: "32"
      HINDSIGHT_API_RERANKER_TEI_MAX_CONCURRENT: "1"
      # Cap how many candidates the CPU cross-encoder scores per recall. The flat
      # default (300) is far too slow here; the plugin recalls at budget=mid.
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "${HINDSIGHT_RERANKER_MAX_CANDIDATES_LOW:?set HINDSIGHT_RERANKER_MAX_CANDIDATES_LOW}"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "${HINDSIGHT_RERANKER_MAX_CANDIDATES_MID:?set HINDSIGHT_RERANKER_MAX_CANDIDATES_MID}"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "${HINDSIGHT_RERANKER_MAX_CANDIDATES_HIGH:?set HINDSIGHT_RERANKER_MAX_CANDIDATES_HIGH}"
      # --- LLM: the existing GLM endpoint (OpenAI-compatible). --------------
      # Hindsight's "openai" provider refuses to start with an empty key even
      # though tensorfold ignores Authorization, so send a fixed dummy. It is
      # not a credential; the endpoint authenticates nothing.
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_LLM_BASE_URL:?set HINDSIGHT_LLM_BASE_URL}"
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_LLM_MODEL:?set HINDSIGHT_LLM_MODEL}"
      HINDSIGHT_API_LLM_REASONING_EFFORT: "${HINDSIGHT_LLM_REASONING_EFFORT:?set HINDSIGHT_LLM_REASONING_EFFORT}"
      HINDSIGHT_API_LLM_API_KEY: no-key-required
      # Memory retains text only; Hermes handles images through the DGX endpoint.
      HINDSIGHT_API_LLM_VISION: "false"
      # Bound background extraction/consolidation/reflect so it cannot saturate
      # the single shared inference endpoint.
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "${HINDSIGHT_LLM_MAX_CONCURRENT:?set HINDSIGHT_LLM_MAX_CONCURRENT}"
      HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: "${HINDSIGHT_LLM_MAX_CONCURRENT:?set HINDSIGHT_LLM_MAX_CONCURRENT}"
      HINDSIGHT_API_REFLECT_LLM_MAX_CONCURRENT: "${HINDSIGHT_LLM_MAX_CONCURRENT:?set HINDSIGHT_LLM_MAX_CONCURRENT}"
      HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: "${HINDSIGHT_LLM_MAX_CONCURRENT:?set HINDSIGHT_LLM_MAX_CONCURRENT}"
      # Do not inherit Hindsight's 64000-token extraction default or unbounded
      # consolidation/reflect output on the shared endpoint. The local test saw
      # a consolidation exceed the client timeout without an explicit ceiling.
      # Retain's limit must exceed the 3000-character chunk size (startup check).
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "8192"
      HINDSIGHT_API_CONSOLIDATION_MAX_COMPLETION_TOKENS: "8192"
      # GLM exhausted 4096 even for one fact. Use a finite 8192 ceiling and
      # small two-fact batches rather than the default eight-fact batches.
      HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE: "2"
      HINDSIGHT_API_REFLECT_MAX_COMPLETION_TOKENS: "8192"
      # --- Telemetry / tracing off. ---
      HINDSIGHT_API_LLM_TRACE_ENABLED: "false"
      HINDSIGHT_API_OTEL_TRACES_ENABLED: "false"
      # OpenAI-style strict json_schema is enabled: the GLM endpoint accepts it
      # (verified on the main side 2026-10-17) and returned schema-conformant
      # JSON, so extraction uses the grammar-constrained path instead of the soft
      # schema-in-prompt + json_object fallback.
      HINDSIGHT_API_LLM_STRICT_SCHEMA: "${HINDSIGHT_LLM_STRICT_SCHEMA:?set HINDSIGHT_LLM_STRICT_SCHEMA}"
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image runs as the unprivileged hindsight user (UID 1000) and needs no
    # writable mount when using an external database and external models.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # python3 from the image base; no curl/wget is guaranteed in the slim image.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s

  hermes:
    # Built by .github/workflows/hermes-agent-image.yml (nousresearch/hermes-agent
    # main c7da41dd base + the Hindsight Hermes integration pinned at d952b6e).
    # Pinned to the published main-c7da41dd image digest (PR #179, 2026-11-02).
    image: ghcr.io/koji-genba/homelab-hermes-agent@sha256:d3215638cc3be6dae647cc308229797b9ed79757575f41400bfaea51b1f37c00
    # The pinned upstream image has no CMD: without this it starts an
    # interactive CLI, hits EOF under Compose and restarts continuously.
    # Keep the s6 entrypoint and explicitly select its gateway service.
    command: ["gateway", "run"]
    restart: unless-stopped
    # The gateway holds no resident model; 1.5 GiB covers the Python runtime, the
    # HTTP/WebSocket clients and the session caches (spillover would be a bug).
    mem_limit: 1.5g
    depends_on:
      hindsight:
        condition: service_healthy
    # Publish only on the Agent LAN address (also used by cdp-tunnel's netns).
    ports:
      - "${AGENT_WEBAPP_BIND_IP:-192.168.10.104}:${AGENT_WEBAPP_PORT:-9120}:${AGENT_WEBAPP_PORT:-9120}"
    env_file:
      # Discord token, allowed user/channel IDs, the operator webhook and the
      # optional dead-man ping URL — sourced from the Agent SOPS bundle.
      # HERMES_DASHBOARD_BASIC_AUTH_USERNAME, _PASSWORD_HASH and _SECRET
      # are passed by the same raw env_file (scrypt dollar signs stay literal).
      - path: "${SECRETS_DIR:?set SECRETS_DIR}/hermes.env"
        format: raw
    environment:
      HERMES_HOME: /opt/data
      TZ: "${AGENT_TIMEZONE:?set AGENT_TIMEZONE}"
      # Apps VM Caddy serves a public certificate; keep normal TLS verification.
      # extra_hosts below pins this name to the Apps LAN IP, as for MCP.
      SEARXNG_URL: "https://${SEARXNG_FQDN:?set SEARXNG_FQDN}"
      # Register Discord slash commands with one bulk overwrite. The default
      # "safe" policy creates ~100 commands one by one at 4.5 s intervals and
      # hit its 600 s timeout on every start on 2026-10-18/19, so the sync never
      # finished. Hermes caps the set at Discord's 100-command limit.
      DISCORD_COMMAND_SYNC_POLICY: bulk
      # The terminal backend connects to the Runner VM over SSH with the Agent
      # VM's dedicated key; config.yaml points terminal.ssh_key at this path.
      # The key name is passed so the role and the config template cannot drift.
      TERMINAL_SSH_KEY: /run/agent-ssh/id_ed25519
    volumes:
      # HERMES_HOME: config.yaml, SOUL.md, USER.md/MEMORY.md, skills, cron,
      # sessions and the SQLite state live here (the durable backup target).
      - type: bind
        source: "${HERMES_DATA_DIR:?set HERMES_DATA_DIR}"
        target: /opt/data
        bind:
          create_host_path: false
      # The Agent VM SSH identity directory (WS1's agent_runner_ssh_key_dir). It
      # holds id_ed25519 (terminal backend, TERMINAL_SSH_KEY below) and
      # known_hosts. The same known_hosts is copied into the Hermes data tree so
      # the terminal backend's hardcoded default path verifies the Runner host
      # key; see tasks/ssh_keys.yml.
      - type: bind
        source: "${AGENT_SSH_KEY_DIR:?set AGENT_SSH_KEY_DIR}"
        target: /run/agent-ssh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal
    # The s6-overlay stage2 hook remaps HERMES_UID/GID and chowns /opt/data, so
    # it needs these capabilities; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    security_opt:
      - no-new-privileges:true
    # Ansible injects host entries so the internal FQDNs resolve to the Apps VM
    # LAN IP even though the AdGuard answer points at a tailnet address the Agent
    # VM (off-tailnet) cannot use. Caddy listens on the LAN IP and its
    # admin_networks include the Server /24, so these are reachable.
    extra_hosts:
      - "${SEARXNG_FQDN:?set SEARXNG_FQDN}:${APPS_VM_LAN_IP:?set APPS_VM_LAN_IP}"
      - "${MCP_SEARXNG_FQDN:?set MCP_SEARXNG_FQDN}:${APPS_VM_LAN_IP:?set APPS_VM_LAN_IP}"

  # Forwards the Runner VM's loopback Chromium CDP port into the Hermes
  # container's network namespace over SSH. Browser control is in the initial
  # scope, so it starts with the rest of the stack (no profile); the SSH command
  # is the container entrypoint rather than an `apk add` at start, so nothing is
  # fetched from the network on boot.
  cdp-tunnel:
    # Reuses the self-built Hermes image: it already ships the OpenSSH client and
    # is digest-pinned, so no separate (and unpinnable-by-digest-content) apk
    # install is needed.
    image: ghcr.io/koji-genba/homelab-hermes-agent@sha256:d3215638cc3be6dae647cc308229797b9ed79757575f41400bfaea51b1f37c00
    restart: unless-stopped
    # Tiny: one ssh process holding a port forward.
    mem_limit: 128m
    # Run as the Hermes data UID so the ssh process can read the 0600 identity
    # (owned by 10000) despite cap_drop: ALL removing CAP_DAC_OVERRIDE. Running as
    # root here fails EACCES on the key (verified locally). The pinned image has
    # a passwd entry/home for UID 10000; known_hosts is explicit regardless.
    user: "10000:10000"
    depends_on:
      hermes:
        condition: service_started
    # Share Hermes' network namespace so `--bind-address 127.0.0.1` lands inside
    # the container and browser.cdp_url=http://127.0.0.1:<port> resolves.
    network_mode: "service:hermes"
    environment:
      CDP_TUNNEL_PORT: "${CDP_TUNNEL_PORT:-9222}"
      CDP_RUNNER_TARGET: "${CDP_RUNNER_TARGET:?set CDP_RUNNER_TARGET}"
    volumes:
      - type: bind
        source: "${AGENT_SSH_KEY_DIR:?set AGENT_SSH_KEY_DIR}"
        target: /run/agent-ssh
        read_only: true
        bind:
          create_host_path: false
    # Override the Hermes entrypoint: this container only runs ssh. The Runner
    # host key is pinned by /run/agent-ssh/known_hosts (written by the role), so
    # StrictHostKeyChecking=yes fails closed on a changed or unknown key instead
    # of silently trusting first contact.
    entrypoint: ["ssh"]
    command:
      - -N
      - -o
      - BatchMode=yes
      - -o
      - UserKnownHostsFile=/run/agent-ssh/known_hosts
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -i
      - /run/agent-ssh/cdp_tunnel_ed25519
      - -L
      - "127.0.0.1:${CDP_TUNNEL_PORT:-9222}:127.0.0.1:${CDP_TUNNEL_PORT:-9222}"
      - "${CDP_RUNNER_TARGET:?set CDP_RUNNER_TARGET}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Project-scoped bridge. Not `internal: true` because Hermes and Hindsight need
  # outbound internet; only Hermes Webapp is published to the host.
  internal:
    driver: bridge

        description: メディアライブラリ（本番）
        siteMonitor: http://stashpad-prod:8080/
    - stashPad staging:
        icon: mdi-image-multiple
        href: https://staging.kojigenba-srv.com
        description: メディアライブラリ（検証）
        siteMonitor: http://stashpad-staging:8080/
    - SillyTavern:
        icon: sillytavern
        href: https://sillytavern.kojigenba-srv.com
        description: AIチャット
    - Open WebUI:
        icon: open-webui
        href: https://openwebui.kojigenba-srv.com
        description: ローカルLLMチャット
        siteMonitor: http://open-webui:8080/health
    - SearXNG:
        icon: searxng
        href: https://searxng.kojigenba-srv.com

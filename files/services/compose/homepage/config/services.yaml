        siteMonitor: http://sparkdash:5555/
- AI・MCP:
    - SearXNG MCP:
        icon: mcp
        href: https://mcp-searxng.kojigenba-srv.com/mcp
        description: 検索用MCPサーバー
        siteMonitor: http://mcp-searxng:3000/health
    - DGX 推論 API:
        icon: mdi-brain
        href: http://192.168.10.51:8000/v1
        description: DGXの推論API
- 基盤・管理:
    - AdGuard Home:
        icon: adguard-home
        href: https://dns.kojigenba-srv.com
        description: 内部DNS・広告ブロック
        siteMonitor: http://adguard:3000/
    - Gatus:
        icon: gatus
        href: https://status.kojigenba-srv.com
        description: サービス監視
        siteMonitor: http://gatus:8080/
        widget:
          type: gatus
          url: http://gatus:8080
          fields: [up, down, uptime]
    - Proxmox pve1:
        icon: proxmox
        href: https://192.168.10.11:8006/
        description: VM・ストレージ管理
    - ElastiFlow/Kibana:
        icon: kibana
        href: https://elastiflow.kojigenba-srv.com
        description: ネットワークフロー分析
- ストレージ (SMB/NFS):
    - shared:
        id: copy-storage-shared
        icon: samba-server
        description: |-
          \\samba.kojigenba-srv.com\shared
          統合共有・SMB認証・tailnet必須
    - shared-hdd:
        id: copy-storage-shared-hdd
        icon: mdi-harddisk
        description: |-
          \\samba.kojigenba-srv.com\shared-hdd
          HDD直接共有・SMB認証・tailnet必須
    - archive:
        id: copy-storage-archive
        icon: mdi-archive
        description: |-
          \\samba.kojigenba-srv.com\archive
          アーカイブ・SMB認証・tailnet必須
    - ai (models・datasets):
        id: copy-storage-ai
        icon: mdi-folder-network
        description: |-
          \\samba.kojigenba-srv.com\ai
          SMB認証・tailnet必須

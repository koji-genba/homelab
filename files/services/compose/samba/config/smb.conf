[global]
    workgroup = HOMELAB
    netbios name = k8s-samba
    security = user
    server role = standalone server
    passdb backend = tdbsam
    store dos attributes = no
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=8388608 SO_SNDBUF=8388608
    use sendfile = yes
    aio read size = 1048576
    strict sync = no
    sync always = no
    kernel oplocks = no
    posix locking = no
    server signing = disabled
    server multi channel support = yes
    deadtime = 15
    smb2 max read = 16777216
    smb2 max write = 16777216
    smb2 max trans = 16777216

[shared]
    path = /mnt/shared
    comment = Shared Storage (mergerfs)
    browseable = yes
    writable = yes
    create mask = 0600
    directory mask = 0700
    valid users = @samba-users

[shared-hdd]
    path = /mnt/shared-hdd
    comment = Shared Storage (HDD direct)
    browseable = yes
    writable = yes
    create mask = 0600
    directory mask = 0700
    valid users = @samba-users

[archive]
    path = /mnt/archive
    comment = Archive Storage
    browseable = yes
    writable = yes
    create mask = 0600
    directory mask = 0700
    valid users = @samba-users

# Models and tar.gz training data for the DGX Spark pair (ADR-0006). Unlike the
# other shares this one is written by both Samba and the two DGX hosts over the
# same NFS export, so files are created world-readable/writable instead of
# 0600/0700. Nothing sensitive belongs here: the contents are re-downloadable.
[ai]
    path = /mnt/ai
    comment = AI models and training data
    browseable = yes
    writable = yes
    create mask = 0666
    directory mask = 0777
    valid users = @samba-users

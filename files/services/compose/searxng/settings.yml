# Overrides merged onto the defaults shipped in the image. server.secret_key
# is supplied through SEARXNG_SECRET and must not be written here.
use_default_settings: true

search:
  # mcp-searxng and Open WebUI call /search?format=json. The default list is
  # html only, and every other format is answered with 403.
  formats:
    - html
    - json

server:
  # Only the trusted networks reach this instance (Caddy and nftables). The
  # limiter needs Valkey and would throttle the API clients above.
  limiter: false

engines:
  # The general web engines enabled by default are brave, duckduckgo and
  # google cse. From this connection brave is rate limited and duckduckgo is
  # answered with a CAPTCHA, so google cse was the only source. These three
  # each return results most of the time but fail now and then, so they are
  # useful together rather than one by one.
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false

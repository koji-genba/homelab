[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
# ansible-core ships the default callback; request its YAML result format
# instead of relying on the removed community `yaml` callback plugin.
stdout_callback = default
result_format = yaml
retry_files_enabled = false
host_key_checking = true
deprecation_warnings = false

[ssh_connection]
pipelining = true

---
- name: Require an encrypted runtime secret bundle on the controller
  ansible.builtin.stat:
    path: "{{ runtime_secrets_file }}"
  delegate_to: localhost
  become: false
  register: secrets_runtime_stat
  no_log: true

- name: Stop before a host is configured without runtime secrets
  ansible.builtin.assert:
    that:
      - secrets_runtime_stat.stat.exists
      - secrets_runtime_stat.stat.isreg
    fail_msg: >-
      runtime_secrets_file must point to an age-encrypted SOPS YAML file on the
      management workstation. The VM never receives the age private key.
  no_log: true

- name: Decrypt runtime secrets on the controller only
  ansible.builtin.command:
    argv:
      - sops
      - decrypt
      - "{{ runtime_secrets_file }}"
  delegate_to: localhost
  become: false
  register: secrets_runtime_decrypted
  changed_when: false
  no_log: true

- name: Parse the transient decrypted bundle
  ansible.builtin.set_fact:
    secrets_runtime: "{{ secrets_runtime_decrypted.stdout | from_yaml }}"
  no_log: true

- name: Validate the required runtime secret keys
  ansible.builtin.assert:
    that:
      - secrets_runtime.cloudflare.api_token | default('') | length > 0
      - secrets_runtime.adguard.username | default('') | length > 0
      - secrets_runtime.adguard.password_hash | default('') | length > 0
      - secrets_runtime.gatus.discord_webhook_url | default('') | length > 0
      - secrets_runtime.gatus.basic_auth_hash | default('') | length > 0
      - secrets_runtime.samba['koji-genba-password'] | default('') | length > 0
      - secrets_runtime.sillytavern.username | default('') | length > 0
      - secrets_runtime.sillytavern.password | default('') | length > 0
      - secrets_runtime.healthchecks.ping_url | default('') | length > 0
    fail_msg: "The decrypted bundle is missing one or more required keys."
  no_log: true

- name: Create runtime secret directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/homelab/secrets
    - /etc/homelab/secrets/samba
    - /etc/homelab/adguard

- name: Write Caddy runtime environment
  ansible.builtin.copy:
    dest: /etc/homelab/secrets/edge.env
    owner: root
    group: root
    mode: '0600'
    content: |
      CF_API_TOKEN={{ secrets_runtime.cloudflare.api_token }}
      GATUS_BASIC_AUTH_USER={{ gatus_basic_auth_user | default('operator') }}
      GATUS_BASIC_AUTH_HASH={{ secrets_runtime.gatus.basic_auth_hash }}
  register: secrets_edge_env
  no_log: true

- name: Write Gatus runtime environment
  ansible.builtin.copy:
    dest: /etc/homelab/secrets/gatus.env
    owner: root
    group: root
    mode: '0600'
    content: "DISCORD_WEBHOOK_URL={{ secrets_runtime.gatus.discord_webhook_url }}\n"
  register: secrets_gatus_env
  no_log: true

- name: Render AdGuard Home configuration outside the Git checkout
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /etc/homelab/adguard/AdGuardHome.yaml
    owner: root
    group: root
    mode: '0600'
  register: secrets_adguard_config
  no_log: true

- name: Write SillyTavern runtime environment
  ansible.builtin.copy:
    dest: /etc/homelab/secrets/sillytavern.env
    owner: root
    group: root
    mode: '0600'
    content: |
      SILLYTAVERN_BASICAUTHUSER_USERNAME={{ secrets_runtime.sillytavern.username }}
      SILLYTAVERN_BASICAUTHUSER_PASSWORD={{ secrets_runtime.sillytavern.password }}
  register: secrets_sillytavern_env
  no_log: true

- name: Write Samba password files expected by the existing image
  ansible.builtin.copy:
    dest: /etc/homelab/secrets/samba/koji-genba-password
    owner: root
    group: root
    mode: '0600'
    content: "{{ secrets_runtime.samba['koji-genba-password'] }}\n"
  register: secrets_samba_password
  no_log: true

- name: Write Healthchecks.io dead-man URL
  ansible.builtin.copy:
    dest: /etc/homelab/secrets/healthchecks.env
    owner: root
    group: root
    mode: '0600'
    content: "HEALTHCHECKS_PING_URL={{ secrets_runtime.healthchecks.ping_url }}\n"
  register: secrets_healthchecks_env
  no_log: true

- name: Record whether runtime secrets or rendered config changed
  ansible.builtin.set_fact:
    secrets_runtime_changed: >-
      {{ secrets_edge_env.changed | default(false) | bool
         or secrets_gatus_env.changed | default(false) | bool
         or secrets_adguard_config.changed | default(false) | bool
         or secrets_sillytavern_env.changed | default(false) | bool
         or secrets_samba_password.changed | default(false) | bool
         or secrets_healthchecks_env.changed | default(false) | bool }}
  no_log: true

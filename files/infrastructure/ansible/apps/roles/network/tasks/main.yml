---
- name: Disable unused IPv6 forwarding and autoconfiguration
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-homelab-ipv6.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.all.forwarding = 0
  notify: Apply sysctl

- name: Require an explicit acknowledgement before adding legacy service IPs
  ansible.builtin.assert:
    that:
      - legacy_service_addresses_enabled | bool
      - legacy_service_cutover_confirmed | default(false) | bool
      - legacy_service_addresses | length == 3
    fail_msg: >-
      Legacy VLAN 11 addresses are disabled by default. Set both
      legacy_service_addresses_enabled and legacy_service_cutover_confirmed
      only after stopping the old MetalLB/DHCP owners, checking leases, and
      confirming ARP absence.
  when: legacy_service_addresses_enabled | bool

- name: Confirm that the intended VLAN 11 interface exists
  ansible.builtin.assert:
    that: legacy_service_interface_name in ansible_facts.interfaces
    fail_msg: >-
      The expected address-less service NIC was not found. Check the VM
      hardware and set legacy_service_interface_name from gathered facts.
  when: legacy_service_addresses_enabled | bool

- name: Install reversible legacy address helper
  ansible.builtin.template:
    src: homelab-service-addresses.sh.j2
    dest: /usr/local/sbin/homelab-service-addresses
    owner: root
    group: root
    mode: '0755'

- name: Install legacy address oneshot unit
  ansible.builtin.template:
    src: homelab-service-addresses.service.j2
    dest: /etc/systemd/system/homelab-service-addresses.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Disable legacy addresses unless cutover was explicitly confirmed
  ansible.builtin.systemd:
    name: homelab-service-addresses.service
    daemon_reload: true
    enabled: "{{ legacy_service_addresses_enabled | bool }}"
    state: "{{ 'started' if legacy_service_addresses_enabled | bool else 'stopped' }}"

# Host resolver. Only meaningful after the final network migration, because
# AdGuard Home listens on the management address only from then on.
- name: Check that the netplan-generated management unit exists
  ansible.builtin.stat:
    path: "/run/systemd/network/10-netplan-{{ apps_management_interface }}.network"
  register: network_management_unit
  when: network_migration_complete | bool

- name: Refuse to guess the management link unit name
  ansible.builtin.assert:
    that: network_management_unit.stat.exists
    fail_msg: >-
      /run/systemd/network/10-netplan-{{ apps_management_interface }}.network
      was not found. Check the netplan interface id and set
      apps_management_interface accordingly.
  when: network_migration_complete | bool

- name: Create the management link drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/network/10-netplan-{{ apps_management_interface }}.network.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: network_migration_complete | bool

- name: Route only the internal zone to the local AdGuard Home
  ansible.builtin.template:
    src: homelab-management-dns.conf.j2
    dest: "/etc/systemd/network/10-netplan-{{ apps_management_interface }}.network.d/50-homelab-dns.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Apply host resolver
  when: network_migration_complete | bool

- name: Create the systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: network_migration_complete | bool

- name: Use public upstreams as the default DNS route
  ansible.builtin.template:
    src: homelab-resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/50-homelab.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply host resolver
  when: network_migration_complete | bool

- name: Apply resolver changes before verifying them
  ansible.builtin.meta: flush_handlers

- name: Read active management DNS servers
  ansible.builtin.command: "resolvectl dns {{ apps_management_interface }}"
  register: network_active_dns_servers
  changed_when: false
  when: network_migration_complete | bool

- name: Read active management DNS domains
  ansible.builtin.command: "resolvectl domain {{ apps_management_interface }}"
  register: network_active_dns_domains
  changed_when: false
  when: network_migration_complete | bool

- name: Reload networkd if a previous run left the DNS drop-in unapplied
  ansible.builtin.command: networkctl reload
  changed_when: true
  when:
    - network_migration_complete | bool
    - >-
      apps_management_ip not in network_active_dns_servers.stdout
      or ('~' ~ apps_internal_dns_domain) not in network_active_dns_domains.stdout

- name: Reconfigure the management link if its DNS drop-in was unapplied
  ansible.builtin.command: "networkctl reconfigure {{ apps_management_interface }}"
  changed_when: true
  when:
    - network_migration_complete | bool
    - >-
      apps_management_ip not in network_active_dns_servers.stdout
      or ('~' ~ apps_internal_dns_domain) not in network_active_dns_domains.stdout

- name: Verify that public names still resolve through the upstreams
  ansible.builtin.command: getent ahostsv4 deb.debian.org
  register: network_dns_public_probe
  changed_when: false
  retries: 5
  delay: 3
  until: network_dns_public_probe.rc == 0
  when: network_migration_complete | bool

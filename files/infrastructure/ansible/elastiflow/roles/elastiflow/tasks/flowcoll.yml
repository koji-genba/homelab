---
# Retain all package defaults except these seven top-level scalar settings.
# First remove duplicate occurrences left by the former append-only installer.
- name: Remove duplicate collector override keys
  ansible.builtin.replace:
    path: /etc/elastiflow/flowcoll.yml
    regexp: '(?m)^[ \t]*{{ item.key }}:[^\n]*\n(?=[\s\S]*^[ \t]*{{ item.key }}:)'
    replace: ''
  loop: "{{ elastiflow_flowcoll_settings | dict2items }}"
  notify: Restart flow collector

- name: Set collector override keys
  ansible.builtin.lineinfile:
    path: /etc/elastiflow/flowcoll.yml
    regexp: '^[ \t]*{{ item.key }}:'
    line: '{{ item.key }}: {{ item.value }}'
  loop: "{{ elastiflow_flowcoll_settings | dict2items }}"
  notify: Restart flow collector

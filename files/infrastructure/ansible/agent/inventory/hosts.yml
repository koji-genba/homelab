all:
  children:
    agent:
      hosts:
        agent-vm:
          # VLAN 10 management address. Confirm it and VMID 104 are free on the
          # live network before the first Terraform apply.
          ansible_host: 192.168.10.104
          ansible_user: deploy
          ansible_become: true
          ansible_python_interpreter: /usr/bin/python3
    runner:
      hosts:
        runner-vm:
          # VLAN 10 management address. Confirm it and VMID 105 are free before
          # the first Terraform apply.
          ansible_host: 192.168.10.105
          ansible_user: deploy
          ansible_become: true
          ansible_python_interpreter: /usr/bin/python3

[defaults]
inventory = inventory/hosts.yml
# Reuse the Apps root's generic roles (currently `docker`) rather than
# duplicating them. Only roles that depend on nothing but site facts may be
# shared this way; the Apps-specific roles (storage/secrets/compose/...) stay
# out of this root.
roles_path = roles:../apps/roles
interpreter_python = auto_silent
# ansible-core ships the default callback; request its YAML result format
# instead of relying on the removed community `yaml` callback plugin.
stdout_callback = default
result_format = yaml
retry_files_enabled = false
host_key_checking = true
deprecation_warnings = false

[ssh_connection]
pipelining = true

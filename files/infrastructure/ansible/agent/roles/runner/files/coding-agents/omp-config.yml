# Managed by Ansible.
modelRoles:
  default: dgx/glm-5.3-flash
# The DGX server falls back to its own default (presumed max) when no effort is
# sent. high keeps omp responsive while Hermes shares the same GPU.
defaultThinkingLevel: high
retry:
  modelFallback: false
tools:
  approvalMode: yolo
startup:
  checkUpdate: false
update:
  auto: false
marketplace:
  autoUpdate: 'off'
telemetry:
  otlpExportEnabled: false
memory:
  backend: 'off'
mcp:
  enableProjectConfig: false
spotlight:
  experiment:
    enabled: false

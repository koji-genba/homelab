# Managed by Ansible.
providers:
  dgx:
    api: openai-completions
    baseUrl: http://192.168.10.51:8000/v1
    auth: none
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: true
      maxTokensField: max_tokens
    models:
      - id: glm-5.3-flash
        contextWindow: 1048576
        maxTokens: 65536
        input: [text, image]
        # Without reasoning: true omp sends no reasoning_effort at all.
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, max]
          defaultLevel: high

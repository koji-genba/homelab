---
# Install as root, never in the execution user's npm prefix. Record the lock
# only after npm ci succeeds, so an interrupted/failed install is retried.
- name: Create the root-managed coding CLI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/coding-agents
    - /var/cache/coding-agents
    - /etc/claude-code
    - /etc/codex

- name: Install the coding CLI manifest and integrity lock
  ansible.builtin.copy:
    src: "coding-agents/{{ item }}"
    dest: "/opt/coding-agents/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - package.json
    - package-lock.json

- name: Read the desired coding CLI lock checksum
  ansible.builtin.stat:
    path: /opt/coding-agents/package-lock.json
    checksum_algorithm: sha256
  register: runner_coding_lock

- name: Read the last successfully installed coding CLI lock checksum
  ansible.builtin.stat:
    path: /opt/coding-agents/.installed-package-lock.json
    checksum_algorithm: sha256
  register: runner_coding_installed_lock

- name: Clear the success marker before replacing the installed packages
  ansible.builtin.file:
    path: /opt/coding-agents/.installed-package-lock.json
    state: absent
  when:
    - runner_coding_installed_lock.stat.exists
    - runner_coding_lock.stat.checksum | default('desired') != runner_coding_installed_lock.stat.checksum

- name: Install coding CLIs when the integrity lock changes
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - ci
      - --no-audit
      - --no-fund
    chdir: /opt/coding-agents
  environment:
    npm_config_cache: /var/cache/coding-agents
    npm_config_update_notifier: 'false'
  when: >-
    runner_coding_lock.stat.checksum | default('desired') !=
    runner_coding_installed_lock.stat.checksum | default('absent')
  register: runner_coding_install
  changed_when: true

- name: Link the coding CLIs into the system PATH
  ansible.builtin.file:
    src: "/opt/coding-agents/node_modules/.bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
    force: true
  loop:
    - claude
    - codex

- name: Install the omp launcher
  ansible.builtin.copy:
    src: coding-agents/omp
    dest: /usr/local/bin/omp
    owner: root
    group: root
    mode: '0755'

- name: Disable Claude Code automatic updates with managed settings
  ansible.builtin.copy:
    src: coding-agents/managed-settings.json
    dest: /etc/claude-code/managed-settings.json
    owner: root
    group: root
    mode: '0644'

# Codex reads /etc/codex/config.toml as the lowest-precedence "system" layer;
# ~/.codex/config.toml overrides it and stays Codex's own (trust, notices, model
# picks), so Ansible only provides defaults here and never writes the user file.
- name: Install the Codex system defaults
  ansible.builtin.copy:
    src: coding-agents/config.toml
    dest: /etc/codex/config.toml
    owner: root
    group: root
    mode: '0644'

# Do not recurse, replace the home, or manage either auth file. CLI token
# refresh needs user-owned writable directories and its existing credentials.
- name: Ensure the runner CLI configuration directories exist
  ansible.builtin.file:
    path: "/home/{{ runner_user }}/{{ item }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0700'
  loop:
    - .codex
    - .omp
    - .omp/agent

- name: Install the omp runner configuration
  ansible.builtin.copy:
    src: "coding-agents/omp-{{ item }}"
    dest: "/home/{{ runner_user }}/.omp/agent/{{ item }}"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0600'
  loop:
    - config.yml
    - models.yml

# ssh.py uses bash -c; remote background jobs additionally use bash -lc.
# /usr/local/bin is in Debian's default PATH for both, without .bashrc edits.
- name: Verify coding CLI launch from both SSH shell modes
  become: true
  become_user: "{{ runner_user }}"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ item }}"
      - >-
        command -v claude && command -v codex &&
        test "$(command -v omp)" = /usr/local/bin/omp &&
        test ! -w /opt/coding-agents &&
        test -d /opt/coding-agents/node_modules/@oh-my-pi/pi-natives-linux-x64 &&
        omp --version </dev/null
  loop:
    - -c
    - -lc
  changed_when: false
  when: not ansible_check_mode

- name: Record the successfully installed coding CLI lock
  ansible.builtin.copy:
    src: /opt/coding-agents/package-lock.json
    remote_src: true
    dest: /opt/coding-agents/.installed-package-lock.json
    owner: root
    group: root
    mode: '0644'
  when:
    - runner_coding_install is changed
    - not ansible_check_mode

- name: Remove the retired dsh launcher
  ansible.builtin.file:
    path: /usr/local/bin/dsh
    state: absent

- name: Remove the retired dsh managed configuration
  become: true
  become_user: "{{ runner_user }}"
  ansible.builtin.file:
    path: "/home/{{ runner_user }}/.dsh/cordis.patch.yml"
    state: absent

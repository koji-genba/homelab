---
# Shared OS baseline for the Agent VM and Runner VM: hostname, packages, the
# `deploy` account, SSH hardening, journald retention, IPv6 off and the host
# resolver. Secrets are never handled here.
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"

- name: Install host prerequisites
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Debian bindings for deb822 repository management
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Ensure the deploy account exists
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password_lock: true

- name: Ensure host configuration drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/ssh/sshd_config.d
    - /etc/sudoers.d
    - /etc/systemd/journald.conf.d
    - /etc/systemd/resolved.conf.d

- name: Install the operator SSH key when provided
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_public_key }}"
    state: present
    manage_dir: true
  when:
    - deploy_public_key is defined
    - deploy_public_key | length > 0
    - not deploy_public_key.startswith('ssh-ed25519 AAAA...')

- name: Restrict SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-homelab-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      AllowUsers {{ ([deploy_user] + (common_ssh_extra_allow_users | default([]))) | join(' ') }}
      {% if cdp_user is defined %}
      # permitopen in authorized_keys limits -L destinations, not -R listeners.
      Match User {{ cdp_user }}
          AllowTcpForwarding local
          PermitOpen 127.0.0.1:{{ cdp_port }}
          PermitListen none
          AllowStreamLocalForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTTY no
          PermitTunnel no
          PermitUserRC no
          # No shell/exec/subsystem channels; ssh -N forwarding still works.
          MaxSessions 0
      Match all
      {% endif %}
      {% if runner_user is defined %}
      Match User {{ runner_user }}
          DisableForwarding yes
          AllowTcpForwarding no
          PermitListen none
          AllowStreamLocalForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTunnel no
      Match all
      {% endif %}
  notify: Restart ssh

- name: Give the deploy account the bootstrap sudo entry point
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}-homelab"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Ansible bootstrap requires become for arbitrary host modules. This is
      # intentionally root-equivalent: the deploy SSH key is the security
      # boundary and must be protected by the operator's key store.
      {{ deploy_user }} ALL=(ALL) NOPASSWD: ALL

- name: Ensure SSH remains available while hardening is applied
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Create host directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop: >-
    {{ ['/etc/homelab', '/opt/homelab', '/var/lib/homelab']
       + (common_extra_directories | default([])) }}

- name: Create the private host secrets directory
  ansible.builtin.file:
    path: /etc/homelab/secrets
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Configure bounded journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-homelab.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      SystemMaxUse=500M
      RuntimeMaxUse=256M
      MaxRetentionSec=14day
  notify: Restart journald

- name: Disable IPv6 forwarding and autoconfiguration
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-homelab-ipv6.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.all.forwarding = 0
  notify: Apply sysctl

- name: Use public upstreams as the default DNS route
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/50-homelab.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (common role). These hosts are off-tailnet, so they
      # do not use AdGuard for internal names; WS2 maps the FQDNs it needs to
      # the Apps LAN address with Compose extra_hosts (PRD 4.1).
      [Resolve]
      DNS={{ common_upstream_dns_servers | join(' ') }}
  notify: Restart systemd-resolved

- name: Ensure systemd-resolved is enabled
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started

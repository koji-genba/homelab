---
- name: Require an encrypted Agent secret bundle on the controller
  ansible.builtin.stat:
    path: "{{ agent_stack_runtime_secrets_file }}"
  delegate_to: localhost
  become: false
  register: agent_stack_secrets_stat
  no_log: true

- name: Stop before the Agent VM is configured without runtime secrets
  ansible.builtin.assert:
    that:
      - agent_stack_secrets_stat.stat.exists
      - agent_stack_secrets_stat.stat.isreg
    fail_msg: >-
      agent_stack_runtime_secrets_file must point to an age-encrypted SOPS YAML
      file on the management workstation. The VM never receives the age key.
  no_log: true

- name: Decrypt the Agent secrets on the controller only
  ansible.builtin.command:
    argv:
      - sops
      - decrypt
      - "{{ agent_stack_runtime_secrets_file }}"
  delegate_to: localhost
  become: false
  register: agent_stack_secrets_decrypted
  changed_when: false
  no_log: true

- name: Parse the transient decrypted bundle
  ansible.builtin.set_fact:
    agent_stack_secrets: "{{ agent_stack_secrets_decrypted.stdout | from_yaml }}"
  no_log: true

- name: Validate the required Agent secret keys
  ansible.builtin.assert:
    that:
      - agent_stack_secrets.discord.bot_token | default('') | length > 0
      - agent_stack_secrets.discord.allowed_users | default('') | length > 0
      - agent_stack_secrets.discord.allowed_channels | default('') | length > 0
      - agent_stack_secrets.discord.free_response_channels | default('') | length > 0
      - agent_stack_secrets.discord.home_channel | default('') | length > 0
      - agent_stack_secrets.monitoring.operator_webhook_url | default('') | length > 0
    fail_msg: "The decrypted Agent bundle has missing required keys."
  no_log: true

# Fail closed, consistent with Discord/monitoring: never silently expose an
# unauthenticated listener or hide an incomplete bundle by disabling Webapp.
- name: Validate the required Webapp authentication strings
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value | length > 0
      - "'\\n' not in item.value"
      - "'\\r' not in item.value"
    fail_msg: "The Agent bundle requires single-line Webapp authentication strings."
  loop:
    - {key: username, value: "{{ agent_stack_secrets.dashboard_basic_auth.username | default('') }}"}
    - {key: password_hash, value: "{{ agent_stack_secrets.dashboard_basic_auth.password_hash | default('') }}"}
    - {key: secret, value: "{{ agent_stack_secrets.dashboard_basic_auth.secret | default('') }}"}
  no_log: true

- name: Validate the Webapp password hash and signing secret formats
  ansible.builtin.assert:
    that:
      - agent_stack_secrets.dashboard_basic_auth.password_hash is match('^scrypt\$[0-9]+\$[0-9]+\$[0-9]+\$[A-Za-z0-9+/]+=*\$[A-Za-z0-9+/]+=*$')
      - agent_stack_secrets.dashboard_basic_auth.secret is match('^[A-Za-z0-9_+/=-]{32,}$')
    fail_msg: "Webapp requires a scrypt hash and a stable random signing secret (32+ characters)."
  no_log: true

- name: Publish the non-secret Discord routing values for the config template
  ansible.builtin.set_fact:
    agent_stack_discord_allowed_channels: "{{ agent_stack_secrets.discord.allowed_channels }}"
    agent_stack_discord_free_response_channels: "{{ agent_stack_secrets.discord.free_response_channels }}"
    agent_stack_discord_home_channel: "{{ agent_stack_secrets.discord.home_channel }}"
  no_log: true

- name: Write the Hermes runtime environment
  ansible.builtin.copy:
    dest: "{{ agent_stack_secrets_dir }}/hermes.env"
    owner: root
    group: root
    mode: '0600'
    content: |
      DISCORD_BOT_TOKEN={{ agent_stack_secrets.discord.bot_token }}
      DISCORD_ALLOWED_USERS={{ agent_stack_secrets.discord.allowed_users }}
      DISCORD_HOME_CHANNEL={{ agent_stack_secrets.discord.home_channel }}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME={{ agent_stack_secrets.dashboard_basic_auth.username }}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH={{ agent_stack_secrets.dashboard_basic_auth.password_hash }}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET={{ agent_stack_secrets.dashboard_basic_auth.secret }}
  register: agent_stack_hermes_env
  no_log: true

- name: Write the monitoring environment consumed by the WS5 health timer
  ansible.builtin.copy:
    dest: "{{ agent_stack_secrets_dir }}/agent-monitoring.env"
    owner: root
    group: root
    mode: '0600'
    content: |
      OPERATOR_WEBHOOK_URL={{ agent_stack_secrets.monitoring.operator_webhook_url }}
      DEADMAN_PING_URL={{ agent_stack_secrets.monitoring.deadman_ping_url | default('') }}
  register: agent_stack_monitoring_env
  no_log: true

# Not a credential for an external system and reproducible from the VM's own
# data, so it is generated here rather than living in the SOPS bundle.
# force=false keeps the first value across runs.
- name: Generate the Hindsight database password once
  ansible.builtin.copy:
    dest: "{{ agent_stack_secrets_dir }}/memory-db.env"
    owner: root
    group: root
    mode: '0600'
    force: false
    content: "POSTGRES_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['hexdigits']) }}\n"
  register: agent_stack_memory_db_env
  no_log: true

- name: Record whether the Agent runtime secrets changed
  ansible.builtin.set_fact:
    agent_stack_secrets_changed: >-
      {{ agent_stack_hermes_env.changed | default(false) | bool
         or agent_stack_monitoring_env.changed | default(false) | bool
         or agent_stack_memory_db_env.changed | default(false) | bool }}
  no_log: true

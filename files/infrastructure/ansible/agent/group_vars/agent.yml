---
# Agent VM (group `agent`) desired state. Non-secret only.
common_hostname: agent
agent_management_ip: 192.168.10.104

# Data disk added by terraform/agent-vm (scsi1). Addressed by its stable
# Proxmox by-id path rather than /dev/sdX ordering; override if the hypervisor
# assigns a different path.
agent_data_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
agent_data_disk_label: agent-data
agent_data_mount: /srv/agent

# Backup export on pve1. The dataset/export does not exist yet (WS5 provisions
# it manually); the play only mounts it when the server advertises the export
# and the guard treats "not mounted" as a safe skip.
agent_backup_mounts:
  - name: agent-backups
    local_path: /mnt/agent-backups
    server: 192.168.10.11
    export: /mnt/tank-gen2/data/agent-backups
    marker: .homelab-export-agent-backups
    marker_value: agent-backups
    options: hard,_netdev,nfsvers=4.1,noatime,nconnect=8

# The Agent VM has no published services; SSH is limited to the shared
# management sources in group_vars/all.yml (server VLAN, Trusted VLAN and the
# tailnet CGNAT range via the gateway subnet route), with no input ports beyond
# SSH. Do not override firewall_ssh_allowed_networks here.
firewall_input_allowed_tcp_ports: []
firewall_egress_restrict: false
# Defence in depth against an accidental Docker `ports:` entry: drop DNAT
# traffic from outside firewall_trusted_networks (equivalent to the Apps VM
# guard). Docker's own tables are never flushed.
firewall_dnat_guard: true

# --- WS2 contract -----------------------------------------------------------
# Role `agent_stack` (WS2) generates the dedicated Runner SSH key pairs on this
# VM and sets the facts `agent_runner_ssh_public_key` and
# `agent_cdp_tunnel_ssh_public_key`. The Runner play consumes those facts.
# WS2 stores the private keys under this directory so WS5's backup can pick
# them up; WS1 only reserves the variable name.
agent_runner_ssh_key_dir: /etc/homelab/agent/ssh

# --- WS5: backup encryption -------------------------------------------------
# The homelab recovery age key (same as SOPS/state backups) encrypts every
# backup and export artifact written to the NFS export. Its identity lives only
# in KeePassXC/the operator workstation and must NEVER be stored on this VM or
# in git. An empty recipient list fails closed rather than writing plaintext.
agent_backup_age_recipients:
  - "age1a8v97ung7t9g39vdxsdxgzta4fq4hz7hv7yezzlx6ac7xfgqgsws420x6u"

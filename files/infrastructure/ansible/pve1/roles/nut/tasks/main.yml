---
- name: Extract NUT credentials on the controller only
  ansible.builtin.command:
    argv: [sops, decrypt, --extract, '["nut"]', "{{ nut_runtime_secrets_file }}"]
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: nut_credentials_result
  no_log: true

- name: Extract only the shared Gatus webhook on the controller
  ansible.builtin.command:
    argv: [sops, decrypt, --extract, '["gatus"]["discord_webhook_url"]', "{{ nut_apps_secrets_file }}"]
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: nut_webhook_result
  no_log: true

- name: Parse transient NUT credentials
  ansible.builtin.set_fact:
    nut_credentials: "{{ nut_credentials_result.stdout | from_yaml }}"
  no_log: true

- name: Validate secret values before deployment
  ansible.builtin.assert:
    that:
      - nut_credentials.upsmon_primary_password is match('^[A-Za-z0-9]{32,}$')
      - nut_credentials.upsmon_secondary_password is match('^[A-Za-z0-9]{32,}$')
      - nut_webhook_result.stdout is match('^https://[!-~]+$')
  no_log: true

- name: Install only Debian NUT packages
  ansible.builtin.apt:
    name: [nut-server, nut-client]
    state: present
    install_recommends: false

# Reading sysfs is safe in check mode, including before NUT is installed.
- name: Find connected CPJ1200 USB devices
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        from pathlib import Path

        devices = []
        for device in Path('/sys/bus/usb/devices').iterdir():
            try:
                if (device.joinpath('idVendor').read_text().strip() != '0764'
                        or device.joinpath('idProduct').read_text().strip() != '0501'):
                    continue
                bus = int(device.joinpath('busnum').read_text())
                number = int(device.joinpath('devnum').read_text())
            except FileNotFoundError:
                continue
            devices.append({'sysfs_path': str(device.resolve()),
                            'node_path': f'/dev/bus/usb/{bus:03d}/{number:03d}'})
        print(json.dumps(devices))
  register: nut_usb_discovery
  check_mode: false
  changed_when: false

- name: Parse connected UPS devices
  ansible.builtin.set_fact:
    nut_usb_devices: "{{ nut_usb_discovery.stdout | from_json }}"

- name: Require the connected CPJ1200
  ansible.builtin.assert:
    that: nut_usb_devices | length > 0
    fail_msg: >-
      CPJ1200 (USB 0764:0501) was not found. Connect the UPS USB cable to
      pve1 and re-run this playbook before starting the NUT driver.

- name: Inspect connected UPS device nodes
  ansible.builtin.stat:
    path: "{{ item.node_path }}"
  loop: "{{ nut_usb_devices }}"
  register: nut_usb_node_stats

- name: Require UPS character device nodes
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.ischr | default(false)
    fail_msg: >-
      CPJ1200 USB device node {{ item.item.node_path }} is missing or is not
      a character device. Check the USB connection and udev before retrying.
  loop: "{{ nut_usb_node_stats.results }}"

# Only retrigger already-connected UPSes whose package rule has not taken effect.
- name: Apply NUT udev rules to connected UPS nodes needing access
  ansible.builtin.command:
    argv: [udevadm, trigger, --action=add, "{{ item.item.sysfs_path }}"]
  loop: "{{ nut_usb_node_stats.results }}"
  when:
    - not ansible_check_mode
    - item.stat.gr_name | default('') != 'nut'
  register: nut_udev_trigger
  changed_when: true
  notify: Restart NUT driver

# This must finish before the permission assertion, not at flush_handlers.
- name: Wait for UPS udev permissions  # noqa: no-handler
  ansible.builtin.command:
    argv: [udevadm, settle, --timeout=30]
  when: nut_udev_trigger is changed
  changed_when: false

- name: Recheck UPS device permissions after udev
  ansible.builtin.stat:
    path: "{{ item.node_path }}"
  loop: "{{ nut_usb_devices }}"
  register: nut_usb_nodes_after_udev
  when: not ansible_check_mode

- name: Require NUT access before starting the driver
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.ischr | default(false)
      - item.stat.gr_name | default('') == 'nut'
    fail_msg: >-
      CPJ1200 node {{ item.item.node_path }} is not accessible to group nut
      after udev processing. Check 62-nut-usbups.rules and the USB connection.
  loop: "{{ nut_usb_nodes_after_udev.results | default([]) }}"
  when: not ansible_check_mode

# On the first --check the package and nut group may not exist yet.
- name: Detect installed NUT monitor
  ansible.builtin.stat:
    path: /usr/sbin/upsmon
  register: nut_monitor_binary

- name: Configure installed NUT
  when: not ansible_check_mode or nut_monitor_binary.stat.exists
  block:
    - name: Create NUT configuration directory
      ansible.builtin.file:
        path: /etc/nut
        state: directory
        owner: root
        group: nut
        mode: '0750'

    - name: Refuse to arm shutdown with a stale killpower flag
      ansible.builtin.stat:
        path: /etc/killpower
      register: nut_killpower

    - name: Require operator review of stale killpower flag
      ansible.builtin.assert:
        that: not nut_killpower.stat.exists
        fail_msg: >-
          /etc/killpower exists. Review the UPS/FSD state and follow ups-nut.md
          before removing it and reapplying. Never arm shutdown with a stale flag.

    - name: Configure driver and mode
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/nut/{{ item }}"
        owner: root
        group: nut
        mode: '0640'
      loop: [nut.conf, ups.conf]
      notify: Enumerate NUT driver

    - name: Configure network listener
      ansible.builtin.template:
        src: upsd.conf.j2
        dest: /etc/nut/upsd.conf
        owner: root
        group: nut
        mode: '0640'
      notify: Restart NUT server

    - name: Configure authentication
      ansible.builtin.template:
        src: upsd.users.j2
        dest: /etc/nut/upsd.users
        owner: root
        group: nut
        mode: '0640'
      no_log: true
      diff: false
      notify: Restart NUT server

    - name: Configure primary monitor
      ansible.builtin.template:
        src: upsmon.conf.j2
        dest: /etc/nut/upsmon.conf
        owner: root
        group: nut
        mode: '0640'
      no_log: true
      diff: false
      notify: Restart NUT monitor

    - name: Store shared webhook without duplicating the bundle key
      ansible.builtin.copy:
        content: "{{ nut_webhook_result.stdout }}\n"
        dest: /etc/nut/discord-webhook
        owner: root
        group: nut
        mode: '0640'
      no_log: true
      diff: false

    - name: Install asynchronous notifier
      ansible.builtin.copy:
        src: homelab-nut-notify
        dest: /usr/local/sbin/homelab-nut-notify
        owner: root
        group: root
        mode: '0755'

    - name: Apply configuration before enabling monitor
      ansible.builtin.meta: flush_handlers

    - name: Enable NUT units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      # Start each daemon explicitly even when a prior apply left configs unchanged.
      # Start nut.target last: it can otherwise pull in all daemons concurrently.
      loop:
        - nut-driver@cpj1200.service
        - nut-server.service
        - nut-monitor.service
        - nut-driver-enumerator.path
        - nut.target

    - name: Read UPS status after deployment
      ansible.builtin.command: upsc cpj1200@localhost ups.status
      register: nut_status
      changed_when: false
      retries: 6
      delay: 5
      until: nut_status.rc == 0
      when: not ansible_check_mode

- name: Explain initial check limitation
  ansible.builtin.debug:
    msg: NUT is not installed; initial check reports packages and USB connection only. Re-run check with diff after installation.
  when: ansible_check_mode and not nut_monitor_binary.stat.exists
